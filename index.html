<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e20100">
<title>霍尼技术交流平台 · 手机端与管理后台</title>
<link rel="stylesheet" href="brand/tokens.css?v=20261123-profile">
<style>
:root{font-family:var(--font-body);color:#111927;background:#f9fafb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}header{height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid #f3f4f6;gap:20px}h1{font-size:18px;font-weight:650;margin:0;letter-spacing:.5px;white-space:nowrap}.demo-tabs{display:flex;align-items:center;gap:5px;border-radius:4px;padding:4px;background:#f9fafb}.demo-tabs button{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:2px;min-width:130px;padding:10px 19px;background:transparent;color:#6c737f;font-size:13px}.demo-tabs button[aria-selected=true]{background:#5747d1;color:white;box-shadow:none}.demo-tabs svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.demo-label{font-size:11px;color:#6c737f;min-width:90px;text-align:right}button:focus-visible{outline:3px solid #d2d6db;outline-offset:3px}[hidden]{display:none!important}.demo-panel{height:calc(100dvh - 72px)}#panel-mobile{display:flex;align-items:center;justify-content:center;padding:20px;background:#f9fafb}.phone-frame{width:393px;height:852px;max-height:100%;max-width:100%;background:#f9fafb;outline:1px solid #e5e7eb;border-radius:22px;overflow:hidden;box-shadow:0 12px 40px #20334f14;flex-shrink:0}iframe{display:block;width:100%;height:100%;border:0;background:#f9fafb}#panel-admin{background:#f9fafb}.noscript{padding:40px;text-align:center}.noscript a{color:#5747d1;margin:0 12px}
@media(max-width:600px){header{height:64px;padding:0 12px;gap:8px}h1{font-size:14px;letter-spacing:0}.demo-label{display:none}.demo-tabs{padding:3px;gap:2px}.demo-tabs button{min-width:0;padding:9px 12px;font-size:12px;gap:5px}.demo-tabs svg{width:14px;height:14px}.demo-panel{height:calc(100dvh - 64px)}#panel-mobile{padding:0;background:#f9fafb}.phone-frame{height:100%;max-height:none;border-radius:0;outline:none;box-shadow:none}}
@media(max-width:360px){h1{font-size:13px}.demo-tabs button{padding-left:9px;padding-right:9px}}
</style>
</head>
<body>
<header>
<h1>霍尼技术交流平台</h1>
<nav class="demo-tabs" role="tablist" aria-label="切换演示端">
<button id="tab-mobile" type="button" role="tab" aria-selected="true" aria-controls="panel-mobile" data-view="mobile"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></svg>手机端</button>
<button id="tab-admin" type="button" role="tab" aria-selected="false" aria-controls="panel-admin" tabindex="-1" data-view="admin"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>管理后台</button>
</nav>
<span class="demo-label">客户演示</span>
</header>
<main>
<section id="panel-mobile" class="demo-panel" role="tabpanel" aria-labelledby="tab-mobile"><div class="phone-frame"><iframe id="frame-mobile" title="手机端素材库 Demo" allow="web-share; clipboard-write" data-base="mobile/?v=20261123-profile"></iframe></div></section>
<section id="panel-admin" class="demo-panel" role="tabpanel" aria-labelledby="tab-admin" hidden><iframe id="frame-admin" title="素材库管理后台 Demo" data-base="admin/?v=20261123-profile"></iframe></section>
</main>
<noscript><p class="noscript">请启用 JavaScript，或直接打开<a href="mobile/">手机端</a><a href="admin/">管理后台</a>。</p></noscript>
<script>
const views=['mobile','admin'];
let activeView='mobile';
const frames=Object.fromEntries(views.map(view=>[view,document.getElementById('frame-'+view)]));
function frameHash(view){try{return frames[view].contentWindow.location.hash;}catch{return frames[view].dataset.route||'';}}
function updateAddress(view,route,push=false){const url=new URL(location.href);url.searchParams.set('view',view);url.hash=route;history[push?'pushState':'replaceState']({view},'',url);}
function activate(view,{route,push=false}={}){
 if(!views.includes(view))view='mobile';
 if(activeView!==view){try{frames[activeView].contentDocument.querySelectorAll('video,audio').forEach(media=>media.pause());}catch{}}
 activeView=view;
 for(const id of views){const selected=id===view,tab=document.getElementById('tab-'+id);tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;document.getElementById('panel-'+id).hidden=!selected;}
 const frame=frames[view];
 if(!frame.dataset.started){frame.dataset.started='true';frame.dataset.route=route||'';frame.src=frame.dataset.base+(route||'');}
 else if(route!==undefined){frame.dataset.route=route;if(frame.dataset.ready&&frameHash(view)!==route)frame.contentWindow.location.hash=route;}
 if(push)updateAddress(view,frame.dataset.ready?frameHash(view):(frame.dataset.route||''),true);
}
for(const view of views){
 const frame=frames[view];
 frame.addEventListener('load',()=>{
  if(!frame.dataset.started||frame.contentWindow.location.href==='about:blank')return;frame.dataset.ready='true';
  try{
   // Keep the original mobile detail links usable through the shared entry point.
   if(frame.dataset.route!==undefined&&frameHash(view)!==frame.dataset.route)frame.contentWindow.location.hash=frame.dataset.route;
   delete frame.dataset.route;
   frame.contentWindow.addEventListener('hashchange',()=>{if(activeView===view)updateAddress(view,frameHash(view));});
   if(activeView===view)updateAddress(view,frameHash(view));
  }catch{}
 });
 document.getElementById('tab-'+view).addEventListener('click',()=>{if(activeView!==view)activate(view,{push:true});});
}
document.querySelector('[role=tablist]').addEventListener('keydown',event=>{
 if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();
 const view=event.key==='Home'?'mobile':event.key==='End'?'admin':views[(views.indexOf(activeView)+1)%2];
 activate(view,{push:true});document.getElementById('tab-'+view).focus();
});
function followAddress(){const view=new URL(location.href).searchParams.get('view')||'mobile';activate(view,{route:location.hash});}
window.addEventListener('popstate',followAddress);
window.addEventListener('hashchange',followAddress);
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==frames.admin.contentWindow)return;
 if(event.data?.type==='htep-demo-switch'&&event.data.view==='mobile')activate('mobile',{push:true});
});
followAddress();
</script>
</body>
</html>
