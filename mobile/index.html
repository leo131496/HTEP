  <script>/* Employee login is a mobile-only demo flow; no real SMS or server session is created. */
const MobileAuth=(()=>{
 const sessionKey='htep-mobile-session-v1';let challenge=null;
 const names=['林晓','陈敏','周宁','张悦','李晨','王璐','赵宇','沈佳','刘洋','许安','孙琪','郑川'];
 const departments=['产品部','市场部','销售部','技术服务部','运营部'];
 const demoEmployees=names.map((name,i)=>({id:'e'+(i+1),name,phone:'139000000'+String(i+1).padStart(2,'0'),department:departments[i%5],enabled:i!==11,deleted:false}));
 const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function employees(){try{const raw=localStorage.getItem('htep-admin-demo-v1');if(!raw)return demoEmployees;const data=JSON.parse(raw);return Array.isArray(data.employees)?data.employees:[];}catch{return [];}}
 function current(){try{const session=JSON.parse(sessionStorage.getItem(sessionKey)||'null');if(!session||session.expires<=Date.now())return null;return employees().find(e=>e.id===session.id&&e.phone===session.phone&&e.enabled&&!e.deleted)||null;}catch{return null;}}
 function header(){const e=current();let slot=document.querySelector('#mobile-account');if(!slot){slot=document.createElement('div');slot.id='mobile-account';document.querySelector('.header-inner').append(slot);}slot.innerHTML=e?`<span>${escape(e.name)}</span><button type="button" data-mobile-action="logout">退出</button>`:'';}
 function show(){document.querySelector('#modal')?.close();header();document.querySelector('.mobile-app').classList.add('mobile-auth-view');document.querySelector('#app').innerHTML=`<section class="mobile-login"><div class="mobile-login-heading"><span>员工专属素材空间</span><h1>手机号登录</h1><p>登录后查阅素材、参与评论，<br>收藏与你有关的专业经验。</p></div><form id="mobile-login-form"><label for="mobile-phone">手机号码</label><input id="mobile-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="11" placeholder="请输入员工手机号" required><label for="mobile-code">验证码</label><div class="mobile-code-field"><input id="mobile-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="请输入验证码" required><button type="button" data-mobile-action="send-code">获取验证码</button></div><p id="mobile-login-feedback" role="status" aria-live="polite"></p><button class="primary mobile-login-submit" type="submit">登录素材库</button></form><div class="mobile-login-demo"><strong>体验员工登录</strong><p>演示手机号：13900000004</p><button type="button" data-mobile-action="fill-phone">填入演示手机号</button><small>点击获取验证码后，使用 123456 登录。<br>当前为演示流程，不发送真实短信。</small></div><p class="mobile-login-foot">仅限已录入并启用的员工账号</p></section>`;}
 function logout(){sessionStorage.removeItem(sessionKey);challenge=null;location.reload();}
 function feedback(message,failed=true){const el=document.querySelector('#mobile-login-feedback');if(el){el.textContent=message;el.classList.toggle('success',!failed);}}
 document.addEventListener('click',event=>{
  const button=event.target.closest('[data-mobile-action]');if(!button)return;
  event.preventDefault();event.stopImmediatePropagation();
  if(button.dataset.mobileAction==='logout'){logout();return;}
  if(button.dataset.mobileAction==='fill-phone'){document.querySelector('#mobile-phone').value='13900000004';return;}
  if(button.dataset.mobileAction==='send-code'){
   const phone=document.querySelector('#mobile-phone').value.trim();
   if(!/^1[3-9]\d{9}$/.test(phone)){feedback('请输入正确的 11 位手机号');return;}
   if(!employees().some(e=>e.phone===phone&&e.enabled&&!e.deleted)){feedback('该员工未录入或已停用，请联系管理员');return;}
   challenge={phone,expires:Date.now()+300000};feedback('演示验证码：123456，5 分钟内有效。',false);
  }
 },true);
 document.addEventListener('submit',event=>{
  if(event.target.id!=='mobile-login-form')return;event.preventDefault();event.stopImmediatePropagation();
  const phone=event.target.elements.phone.value.trim(),code=event.target.elements.code.value.trim();
  const e=employees().find(e=>e.phone===phone&&e.enabled&&!e.deleted);
  if(!e){feedback('该员工未录入或已停用，请联系管理员');return;}
  if(!challenge||challenge.phone!==phone||challenge.expires<=Date.now()||code!=='123456'){feedback('请先获取验证码，并填写有效的演示验证码');return;}
  try{sessionStorage.setItem(sessionKey,JSON.stringify({id:e.id,phone:e.phone,expires:Date.now()+86400000}));location.reload();}catch{feedback('浏览器未允许保存登录状态，请在普通浏览窗口重试');}
 },true);
 document.addEventListener('click',event=>{if(!current()&&event.target.closest('[data-action]')){event.preventDefault();event.stopImmediatePropagation();show();}},true);
 window.addEventListener('storage',event=>{if(event.key==='htep-admin-demo-v1'){if(!current())logout();else header();}});
 return {current,show,header,sessionKey};
})();
</script>

 const target=getItem(itemId),parent=allComments().find(c=>c.id===parentId);if(itemId&&!target){toast('这份素材暂时不可用');return;}composeImages=[];
 showDialog(parent?'回复评论':'发表评论',`<form id="comment-form">${target?`<div class="comment-context">${icon('file')}<span>${esc(target.title)}</span></div>`:`<label class="form-field"><span class="field-label">关联素材 <b>*</b></span><select id="comment-item" required><option value="">请选择讨论的素材</option>${materials().map(i=>`<option value="${esc(i.id)}">${esc(i.title)}</option>`).join('')}</select></label>`}${parent?`<blockquote class="reply-context">回复 ${esc(parent.author)}：${esc(parent.text)}</blockquote>`:''}<label class="form-field"><span class="field-label">${parent?'回复内容':'评论内容'} <b>*</b></span><textarea id="comment-text" required maxlength="1000" placeholder="${parent?'写下你的回复':'提出问题或分享你的经验'}"></textarea></label><div class="form-field"><span class="field-label">图片附件 <span class="optional">选填</span></span><label class="comment-file-picker">${icon('image')}添加图片<input type="file" id="comment-files" multiple accept=".png,.jpg,.jpeg,.gif,.webp" aria-label="添加评论图片"></label><p class="field-help">最多 3 张，每张不超过 20 MB。</p><div class="compose-images" id="compose-images"></div></div><p class="inline-error" id="comment-error" role="alert"></p><button type="submit" id="comment-submit" class="primary full-width">${parent?'提交回复':'提交评论'}</button></form>`);
 $('#comment-files').onchange=e=>{const files=[...e.target.files];e.target.value='';if(files.length+composeImages.length>3){$('#comment-error').textContent='最多只能添加 3 张图片。';return;}if(files.some(f=>fileKind(f.name)!=='image'||f.size>20*1024*1024||!f.size)){$('#comment-error').textContent='请选择非空图片，每张不超过 20 MB。';return;}composeImages.push(...files);$('#comment-error').textContent='';renderComposeImages();};
 $('#comment-form').onsubmit=async e=>{e.preventDefault();const text=$('#comment-text').value.trim(),selectedId=target?.id||$('#comment-item').value;if(!text){$('#comment-error').textContent='请填写评论内容，不能只输入空格。';return;}if(!getItem(selectedId)){$('#comment-error').textContent='请先选择一份素材。';return;}const button=$('#comment-submit'),token=renderToken,role=state.role;button.disabled=true;
 try{const selectedImages=[...composeImages];for(const file of selectedImages)await validateFile(file);const c={id:'comment-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),itemId:selectedId,owner:role,author:roles[role],text,created:new Date().toISOString(),likes:0,images:selectedImages.map(f=>({blob:f,name:f.name})),...(parent?{parentId:parent.parentId||parent.id,replyTo:parent.author}:{})};await persistInteraction('comments',c);localComments.unshift(c);if(token===renderToken&&modal.open){closeDialog();render();if(location.hash.startsWith('#knowledge/'))$('#comments-section')?.scrollIntoView({block:'start'});toast(parent?'回复已发布':'评论已发布');}}
 catch(error){if(token===renderToken&&modal.open)$('#comment-error').textContent=error.message||'评论未能保存，请重试。';}finally{button.disabled=false;}};
}
function renderComposeImages(){const box=$('#compose-images');if(!box)return;box.innerHTML=composeImages.map((f,i)=>{const url=URL.createObjectURL(f);modalUrls.push(url);return `<div><img src="${url}" alt="${esc(f.name)}"><button type="button" data-action="remove-comment-image" data-index="${i}" aria-label="移除图片 ${i+1}">${icon('close')}</button></div>`;}).join('');}
function showCommentImage(c,index){const img=c?.images?.[index];if(!img)return;showDialog('评论图片','',true);const url=img.asset?ASSETS[img.asset]:URL.createObjectURL(img.blob);if(!img.asset)modalUrls.push(url);$('#modal-body').innerHTML=`<img class="preview-media" src="${esc(url)}" alt="${esc(img.name)}">`;}
function persistInteraction(store,record){return new Promise((resolve,reject)=>{if(!db){reject(Error('本地存储不可用，请使用普通浏览窗口打开 Demo。'));return;}const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(record);tx.oncomplete=resolve;tx.onerror=tx.onabort=()=>reject(Error('本地保存失败，请检查浏览器存储空间后重试。'));});}
async function loadInteractions(){localComments=await new Promise((resolve,reject)=>{const req=db.transaction('comments').objectStore('comments').getAll();req.onsuccess=()=>resolve(req.result);req.onerror=reject;});}
const personalInfo={comments:{title:'我的评论',icon:'comment',description:'查看你发表的评论、回复及关联素材',empty:'还没有评论记录',hint:'在素材详情或评论互动中发表第一条评论。'},shares:{title:'我的分享',icon:'share',description:'查看你分享的素材及分享时间',empty:'还没有分享记录',hint:'在素材详情中复制分享链接或完成系统分享后，记录会出现在这里。'},favorites:{title:'我的收藏',icon:'star',description:'常用资料集中保存，随时回来查阅',empty:'还没有收藏素材',hint:'点击素材旁的星标，将常用资料收藏到这里。'},downloads:{title:'我的下载',icon:'download',description:'查看你发起的文件下载记录',empty:'还没有下载记录',hint:'在素材详情中下载文件后，记录会出现在这里。'}};
function historyDate(value){return value?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(value)):'历史收藏';}
function renderPersonal(mode){
 releaseCommentUrls();const info=personalInfo[mode];let list;
 if(mode==='comments')list=myComments().sort((a,b)=>b.created.localeCompare(a.created));
 else if(mode==='favorites')list=materials().filter(i=>isSaved(i.id)).map(i=>({itemId:i.id,created:state.favoriteDates[state.role+':'+i.id],method:'已收藏'})).sort((a,b)=>(b.created||'').localeCompare(a.created||''));
 else list=myActivity(mode==='shares'?'share':'download').sort((a,b)=>b.created.localeCompare(a.created));
 app.innerHTML=`<button class="back-row" data-action="home">${icon('back')}返回素材库</button><section class="page-intro"><div><h1>${info.title}</h1><p>${info.description}</p></div></section><nav class="personal-nav" aria-label="我的互动页面">${Object.entries(personalInfo).map(([key,v])=>`<a href="#my-${key}" ${key===mode?'aria-current="page"':''}>${v.title}</a>`).join('')}</nav><div class="result-line"><span>共 <strong>${list.length}</strong> 条记录</span><span>${esc(roles[state.role])} · 按时间倒序</span></div><section id="personal-records" class="${mode==='comments'?'':'knowledge-list'}" aria-label="${info.title}记录">${list.length?(mode==='comments'?list.map(c=>commentCard(c,{source:true})).join(''):list.map(r=>{const i=getItem(r.itemId);return `<article class="knowledge-row history-row"><button class="row-main" data-action="detail" data-id="${esc(i.id)}">${fileIcon(i)}<div class="row-content"><h3>${esc(i.title)}</h3><p>${esc(i.fileName)} · ${prettySize(i.size)}</p><div class="row-meta"><span class="category">${esc(r.method)}</span><time>${historyDate(r.created)}</time></div></div></button><div class="history-actions"><button class="text-button" data-action="detail" data-id="${esc(i.id)}">查看</button>${mode==='favorites'?favoriteButton(i):`<button class="icon-button" data-action="${mode==='shares'?'share':'download'}" data-id="${esc(i.id)}" aria-label="${mode==='shares'?'再次分享':'再次下载'}${esc(i.title)}">${icon(info.icon)}</button>`}</div></article>`;}).join('')):`<div class="knowledge-list empty">${icon(info.icon)}<h3>${info.empty}</h3><p>${info.hint}</p><button class="secondary" data-action="home">浏览素材</button></div>`}</section>${mode==='downloads'?'<p class="personal-note">记录表示已发起下载；文件是否保存完成，请查看浏览器下载列表。</p>':''}`;
}
function handleInteractionAction(button){
 const a=button.dataset.action,c=allComments().find(c=>c.id===button.dataset.cid);
 if(['my-comments','my-shares','my-favorites','my-downloads'].includes(a)){if(location.hash==='#'+a)renderPersonal(a.slice(3));else location.hash=a;}
 else if(a==='clear-comment-search'){state.commentQuery='';$('#comment-search').value='';renderCommentResults();$('#comment-search').focus();}
 else if(a==='new-discussion')openComment();
 else if(a==='new-comment')openComment(button.dataset.id);
 else if(a==='reply-comment'&&c)openComment(c.itemId,c.id);
 else if(a==='comment-image'&&c)showCommentImage(c,Number(button.dataset.index));
 else if(a==='remove-comment-image'){composeImages.splice(Number(button.dataset.index),1);renderComposeImages();}
 else if(a==='like-comment'&&c){const liked=state.likedComments.includes(c.id);state.likedComments=liked?state.likedComments.filter(id=>id!==c.id):[...state.likedComments,c.id];saveState();button.classList.toggle('liked',!liked);button.setAttribute('aria-pressed',String(!liked));button.setAttribute('aria-label',`${liked?'点赞':'取消点赞'}${c.author}的评论`);$('span',button).textContent=(c.likes||0)+(liked?0:1);}
 else if(a==='jump-comments'){$('#comments-section').scrollIntoView({behavior:'smooth',block:'start'});}
 else return false;return true;
}
start();
</script>
</body>
